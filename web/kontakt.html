  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">

<body>
  <a class="skip-link" href="#main">Přeskočit na hlavní obsah</a>

  <header class="site-header">
    <a class="logo" href="/index.html">The Early Bowl</a>
    <nav aria-label="Hlavní navigace">
      <button class="nav-toggle" aria-label="Otevřít menu" aria-expanded="false">☰</button>
      <ul class="nav-list">
        <li><a href="/menu.html">Menu</a></li>
        <li><a href="/o-nas.html">O nás</a></li>
        <li><a href="/kontakt.html" aria-current="page">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <section class="section container">
      <h1>Stav se za námi</h1>
      <!-- TODO: adresa, tel: a mailto: odkazy, otevírací doba, Google Maps iframe (PRD §9.3) -->

      <!-- Kontaktní formulář — Formspree (PRD §5.2). Doplnit action="https://formspree.io/f/XXXX" -->
      <form id="contact-form" action="#" method="POST" novalidate>
        <!-- honeypot proti spamu -->
        <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <div class="field">
          <label for="name">Tvoje jméno</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div class="field">
          <label for="email">Tvůj e-mail</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="msg">Co potřebuješ?</label>
          <textarea id="msg" name="message" rows="4" required></textarea>
        </div>
        <button class="btn btn--primary" type="submit">Pošli zprávu</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><strong>The Early Bowl</strong> · OD Stará Breda, Opava · 6:00–13:30</p>
      <p><a href="tel:+420777000111">+420 777 000 111</a> · <a href="mailto:info@theearlybowl.cz">info@theearlybowl.cz</a></p>
      <p><a href="/podminky.html">Obchodní podmínky &amp; ochrana údajů</a></p>
    </div>
  </footer>

  <script src="/js/nav.js" defer></script>
  <script src="/js/form.js" defer></script>
</body>
</html>
